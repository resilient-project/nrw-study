# yaml-language-server: $schema=./schema.default.json

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#version
version: v2026.02.0

remote:
  ssh: "z3"
  path: "scratch/projects/nrw-study"

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#run
run:
  prefix: "nrw-targets"
  name:
  - oge-grid___Ref___offshore-co2
  - endo-grid___Ref___offshore-co2
  - endo-grid___CCS-Exp__offshore-co2
  - endo-grid___CCS-Exp__offshore+onshore-co2
  scenarios:
    enable: true
    file: config/scenarios.nrw.yaml
  disable_progressbar: false
  shared_resources:
    policy: false
    exclude: []
  use_shadow_directory: false


# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#foresight
foresight: myopic

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#scenario
scenario:
  clusters:
  - adm
  opts:
  - ""
  sector_opts:
  - ""
  planning_horizons:
  - 2035
  - 2040
  - 2045

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#countries
countries:
- AL
- AT
- BA
- BE
- BG
- CH
- CZ
- DE
- DK
- EE
- ES
- FI
- FR
- GB
- GR
- HR
- HU
- IE
- IT
- LT
- LU
- LV
- ME
- MK
- NL
- 'NO'
- PL
- PT
- RO
- RS
- SE
- SI
- SK
- XK

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#electricity
electricity:
  renewable_carriers:
  - solar
  - onwind
  - "offwind-ac"
  - "offwind-dc"
  - hydro

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#transmission
transmission:
  hydrogen:
    enable: true
    gabriel_filter_min_degree: 0
    max_offshore_haversine_distance: 300
    length_factor: 1.25
    cost_factor: 1
    retrofit:
      enable: false
      capacity_per_ch4: 0.6
    efficiency:
      enable: true
      efficiency_per_1000km: 1.0
      compression_per_1000km: 0.018
  carbon_dioxide:
    enable: true
    gabriel_filter_min_degree: 0
    max_offshore_haversine_distance: 300
    length_factor: 1.25
    cost_factor: 1
    projects:
      enable: true
      extendable: false
      capacity_mode: keep
      custom_capacity_value: 1328
    efficiency:
      enable: true
      efficiency_per_1000km: 0.999
    short_pipeline_carrier:
      enable: true
      suffix: short
      max_haversine_distance: 100

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#sector
sector:
  transport: true
  heating: true
  biomass: true
  industry: true
  shipping: true
  aviation: true
  agriculture: true
  fossil_fuels: true
  regional_co2_sequestration_potential:
    enable: true
    attribute:
    - conservative estimate Mt
    - conservative estimate GAS Mt
    - conservative estimate OIL Mt
    - conservative estimate aquifer Mt
    include_onshore: true
    min_size: 1
    max_size: 25
    years_of_storage: 25
  co2_sequestration_potential:
    2020: 0
    2025: 0
    2030: 40
    2035: 100
    2040: 180
    2045: 250
    2050: 250
  co2_sequestration_cost: 30
  co2_sequestration_lifetime: 50
  chp:
    enable: true
    fuel:
    - solid biomass
    - gas
    micro_chp: false
  chp_cc:
    enable: true
    fuel:
    - solid biomass

# docs in https://pypsa-eur.readthedocs.io/en/latest/configuration.html#clustering
clustering:
  mode: administrative
  administrative:
    level: 0
    countries:
      BE: 1
      DE: 2
      NL: 1
      DEA: 3

solving:
  mem_mb: 30000
  memory_logging_frequency: 5
  runtime: 1h
  options:
    skip_iterations: false # set to true skips iterations and disables post_discretization
    min_iterations: 1
    max_iterations: 1
    post_discretization:
      enable: true
      carriers:
      - CO2 pipeline
      - CO2 pipeline short
      link_unit_size:
        CO2 pipeline: 3198 # 0.7m
        CO2 pipeline short: 1012 # 0.4m
      link_threshold:
        CO2 pipeline: 0.2
        CO2 pipeline short: 0.2
      fractional_last_unit_size: false
    custom_extra_functionality: ../data/custom_extra_functionality.py
  constraints:
    limits_capacity_min:
      Generator:
        onwind:
          DE:
            2035: 115   # Wind-an-Land Law 2030
            2040: 157   # target 2035
            2045: 160   # target 2040
        offwind:
          DE:
            2035: 40    # WindSeeG
            2040: 50
            2045: 70    # WindSeeG
        solar:
          DE:
            2035: 215   # EEG 2023
            2040: 400   # EEG 2023
            2045: 400
    limits_capacity_max:
      Generator:
        onwind:
          DE:
            2035: 160
            2040: 250
            2045: 250
        offwind:
          DE:
            2035: 50
            2040: 60
            2045: 80
        solar:
          DE:
            2035: 315   # EEG 2023
            2040: 500
            2045: 500
  override_offwind_p_nom_max:
    DE:
      2035: 50
      2040: 60
      2045: 80

data:
  scigrid_gas:
    source: archive
    version: latest
  swiss_energy_balances:
    source: primary
    version: latest
  synthetic_electricity_demand:
    source: archive
    version: latest
  copernicus_land_cover:
    source: archive
    version: latest
  bfs_road_vehicle_stock:
    source: archive
    version: latest
  bfs_gdp_and_population:
    source: primary
    version: latest

industry:
  forecast_industry:
    enable: true
    current_electricity_year: 2021
    strict_industry_validation: true
    mto_route: true
    available_scenarios:
      - Orientierungsszenario_Strom
      - Industrie-CCS
    scenario_mapping:
      oge-grid___Ref___offshore-co2: Orientierungsszenario_Strom
      endo-grid___Ref___offshore-co2: Orientierungsszenario_Strom
      endo-grid___CCS-Exp__offshore-co2: Industrie-CCS
      endo-grid___CCS-Exp__offshore+onshore-co2: Industrie-CCS
